# 火山引擎 VKE 部署配置
images:
  repository: microservices-demo-cn-shanghai.cr.volces.com/microservices-demo/microservices-demo
  tag: "v0.10.4"

serviceAccounts:
  create: true
  # 为所有服务账号添加镜像拉取密钥
  annotations:
    eks.volcengine.com/image-pull-secrets: volc-registry-secret

opentelemetryCollector:
  create: false

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

# 火山引擎 APM Plus 配置
volcengineAPM:
  enabled: true
  endpoint: "apmplus-cn-shanghai.volces.com:4317"
  appKey: "76b9dba29c1c7de06a5a8f646d2b19d7"
  compression: gzip
  insecure: true

# 自建可观测性栈配置 (与 volcengineAPM 互斥)
# 切换时将 volcengineAPM.enabled 改为 false，selfHostedObservability.enabled 改为 true
selfHostedObservability:
  enabled: false
  collectorName: otel-collector-self
  prometheusRemoteWrite:
    endpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write"
  tempo:
    endpoint: "tempo.monitoring.svc:4317"
    insecure: true
  loki:
    endpoint: "http://loki.monitoring.svc:3100/loki/api/v1/push"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  create: true
  externalService: true

loadGenerator:
  create: true

cartDatabase:
  inClusterRedis:
    create: true
    # 使用火山引擎 CR 的 redis 镜像，而不是公共镜像
    publicRepository: false
