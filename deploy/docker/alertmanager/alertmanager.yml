global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'namespace', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Critical 级别告警 -> 立即通知 + 高频重复
    - matchers:
        - severity="critical"
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Warning 级别告警 -> 正常频率
    - matchers:
        - severity="warning"
      receiver: 'warning'
      repeat_interval: 6h

    # online-boutique 业务告警
    - matchers:
        - namespace="online-boutique"
      receiver: 'online-boutique'
      group_wait: 30s

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://prometheus-alert:8080/prometheusalert?type=fs&tpl=prometheus-fs'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://prometheus-alert:8080/prometheusalert?type=fs&tpl=prometheus-fs'
        send_resolved: true

  - name: 'warning'
    webhook_configs:
      - url: 'http://prometheus-alert:8080/prometheusalert?type=fs&tpl=prometheus-fs'
        send_resolved: true

  - name: 'online-boutique'
    webhook_configs:
      - url: 'http://prometheus-alert:8080/prometheusalert?type=fs&tpl=prometheus-fs'
        send_resolved: true

inhibit_rules:
  # 当服务 down 时，抑制该服务的其他告警
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - namespace="online-boutique"
    equal: ['namespace', 'deployment']

  # 当节点 down 时，抑制该节点的其他告警
  - source_matchers:
      - alertname="NodeDown"
    target_matchers:
      - severity="warning"
    equal: ['node']
