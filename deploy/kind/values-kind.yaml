# kind 本地集群镜像配置
# 镜像直接从本地 kind-registry 拉取（由 Makefile.kind build-images 构建并推送）
# arm64 环境：所有服务为原生 arm64 构建（cartservice 除外，保留 amd64）
# amd64 环境：从 Google public registry 拉取 amd64 预构建镜像
images:
  repository: kind-registry:5000/google-samples/microservices-demo
  tag: "v0.10.4"

selfHostedObservability:
  enabled: true
  imagePullSecret: ""
  prometheusRemoteWrite:
    endpoint: "http://47.83.217.162:9090/api/v1/write"
  tempo:
    endpoint: "47.83.217.162:4317"
    insecure: true
  loki:
    otlpEndpoint: "http://47.83.217.162:3100/otlp"

volcengineAPM:
  enabled: false

frontend:
  externalService: false
  platform: local
