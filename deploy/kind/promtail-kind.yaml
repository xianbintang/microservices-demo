# promtail kind overlay - push to remote Loki
image:
  registry: registry.cn-hangzhou.aliyuncs.com
  repository: baiji-aliyun/promtail
  tag: "3.5.1"
imagePullSecrets: []

config:
  # Push to remote Loki
  clients:
    - url: http://47.83.217.162:3100/loki/api/v1/push

  # Scrape config for Kubernetes Pods
  snippets:
    scrapeConfigs: |
      # Kind cluster uses containerd, need cri parser
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - online-boutique
                - monitoring
        pipeline_stages:
          - cri: {}
        relabel_configs:
          # Exclude deleted pods
          - action: drop
            source_labels: [__meta_kubernetes_pod_deleted]
            regex: "true"
          # Exclude non-running pods
          - action: drop
            source_labels: [__meta_kubernetes_pod_phase]
            regex: "Pending|Succeeded|Failed"
          # Extract log path
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            regex: '(.+);(.+)'
            replacement: '/var/log/pods/*$1/$2/*.log'
            target_label: __path__
          # Keep pod labels
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

# Tolerations for kind single-node
tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
