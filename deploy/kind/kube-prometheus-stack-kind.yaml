# kube-prometheus-stack kind overlay
# Resets all images from private Volcengine registry back to chart defaults (public registries)
# Removes imagePullSecrets, enables node-exporter, switches Grafana to ClusterIP

# ── Remove global imagePullSecrets ────────────────────────────
global:
  imagePullSecrets: []

# ── Prometheus Operator: reset to chart defaults ──────────────
prometheusOperator:
  imagePullSecrets: []
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: ""
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: ""
  # Disable TLS and admission webhooks entirely for kind
  # (no certgen job, no TLS secret mount, operator starts cleanly)
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false

# ── Prometheus: reset to chart defaults + reduce resources ────
prometheus:
  prometheusSpec:
    imagePullSecrets: []
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.2.1
    # Reduce for local dev
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    retention: 1h
    retentionSize: "500MB"
    # Remove VKE-specific scrape job (kind has native node-exporter)
    additionalScrapeConfigs: []
    # Local cluster acts as collector only: disable local rule evaluation/alert forwarding
    ruleSelector:
      matchLabels:
        local-alerting: "enabled"
    ruleNamespaceSelector: {}
    additionalAlertManagerConfigs: []
    # Remote write to remote Prometheus (metrics only)
    remoteWrite:
      - url: "http://47.83.217.162:9090/api/v1/write"
        queueConfig:
          maxSamplesPerSend: 10000
          maxShards: 30
          capacity: 5000
          minShards: 1
          maxRetries: 3
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            action: drop
            regex: "ALERTS|ALERTS_FOR_STATE"

# ── Grafana: disabled — use remote Grafana at 47.83.217.162:3000 ───
grafana:
  enabled: false

# ── AlertManager: disabled — use remote Alertmanager at 47.83.217.162:9093 ──
alertmanager:
  enabled: false

# ── kube-state-metrics: reset to chart defaults ───────────────
kube-state-metrics:
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: ""

# ── node-exporter: enable (no VKE conflict in kind) ──────────
nodeExporter:
  enabled: true

prometheus-node-exporter:
  image:
    registry: quay.io
    repository: prometheus/node-exporter
    tag: ""

# Collector-only mode in kind: do not create built-in alert rules locally
# (alert evaluation is centralized on remote Prometheus)
defaultRules:
  create: false
