# kube-prometheus-stack kind overlay
# Resets all images from private Volcengine registry back to chart defaults (public registries)
# Removes imagePullSecrets, enables node-exporter, switches Grafana to ClusterIP

# ── Remove global imagePullSecrets ────────────────────────────
global:
  imagePullSecrets: []

# ── Prometheus Operator: reset to chart defaults ──────────────
prometheusOperator:
  imagePullSecrets: []
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: ""
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: ""
  # Disable TLS and admission webhooks entirely for kind
  # (no certgen job, no TLS secret mount, operator starts cleanly)
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false

# ── Prometheus: reset to chart defaults + reduce resources ────
prometheus:
  prometheusSpec:
    imagePullSecrets: []
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.2.1
    # Reduce for local dev
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    retention: 1h
    retentionSize: "500MB"
    # Remove VKE-specific scrape job (kind has native node-exporter)
    additionalScrapeConfigs: []
    # Point to remote Alertmanager (local AM disabled)
    additionalAlertManagerConfigs:
      - scheme: http
        static_configs:
          - targets:
              - "47.83.217.162:9093"
    remoteWrite:
      - url: "http://47.83.217.162:9090/api/v1/write"
        queueConfig:
          maxSamplesPerSend: 1000
          maxShards: 5
          capacity: 300

# ── Grafana: disabled — use remote Grafana at 47.83.217.162:3000 ───
grafana:
  enabled: false

# ── AlertManager: disabled — use remote Alertmanager at 47.83.217.162:9093 ──
alertmanager:
  enabled: false

# ── kube-state-metrics: reset to chart defaults ───────────────
kube-state-metrics:
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: ""

# ── node-exporter: enable (no VKE conflict in kind) ──────────
nodeExporter:
  enabled: true

prometheus-node-exporter:
  image:
    registry: quay.io
    repository: prometheus/node-exporter
    tag: ""
