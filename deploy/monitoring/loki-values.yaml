# Loki Helm Chart Values
# 单体模式部署，适合中小规模集群
# Helm version: 6.6.2
# 镜像仓库: microservices-demo-cn-shanghai.cr.volces.com/microservices-demo/microservices-demo

# ===========================================
# 镜像配置
# ===========================================
imagePullSecrets:
  - name: volc-registry-secret

# ===========================================
# 部署模式: 单体模式
# ===========================================
deploymentMode: SingleBinary

# ===========================================
# Loki 配置 (Loki 3.x 格式)
# ===========================================
loki:
  auth_enabled: false
  image:
    registry: microservices-demo-cn-shanghai.cr.volces.com
    repository: microservices-demo/microservices-demo/loki
    tag: "3.0.0"

  # 禁用 ruler
  ruler:
    enabled: false
    replicas: 0

  # 禁用 analytics
  analytics:
    reporting_enabled: false

  commonConfig:
    replication_factor: 1

  # Schema 配置
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # 存储配置
  storage:
    type: filesystem

  # Limits 配置
  limits_config:
    retention_period: 744h
    max_query_series: 10000
    max_query_parallelism: 32
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB

  # Ingester 配置 (Loki 3.x 简化)
  ingester:
    chunk_idle_period: 1h
    chunk_target_size: 1572864
    max_chunk_age: 1h

  querier:
    max_concurrent: 20

# ===========================================
# 禁用内置 memcached 缓存
# ===========================================
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# 禁用 canary
test:
  enabled: false

lokiCanary:
  enabled: false

# ===========================================
# 单体模式配置
# ===========================================
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # 使用 emptyDir (无存储类时重启会丢失数据)
  persistence:
    enabled: false
  # 手动挂载 /var/loki，避免 ruler-storage 因只读根文件系统崩溃
  extraVolumes:
    - name: loki-data
      emptyDir: {}
  extraVolumeMounts:
    - name: loki-data
      mountPath: /var/loki

# ===========================================
# 禁用分布式模式组件
# ===========================================
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  enabled: false

# ===========================================
# 监控配置
# ===========================================
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# ===========================================
# 服务配置
# ===========================================
service:
  type: ClusterIP
  ports:
    http: 3100
    grpc: 9095