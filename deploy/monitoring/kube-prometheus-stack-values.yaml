# kube-prometheus-stack Helm Chart Values
# 用于部署 Prometheus + Grafana + AlertManager 监控栈
# Helm version: 65.5.0
# 镜像仓库: microservices-demo-cn-shanghai.cr.volces.com/microservices-demo/microservices-demo

# ===========================================
# Prometheus Operator 配置
# ===========================================
# ===========================================
# 全局 imagePullSecrets
# ===========================================
global:
  imagePullSecrets:
    - name: volc-registry-secret

prometheusOperator:
  enabled: true
  image:
    registry: microservices-demo-cn-shanghai.cr.volces.com
    repository: microservices-demo/microservices-demo/prometheus-operator
    tag: v0.77.2
  imagePullSecrets:
    - name: volc-registry-secret
  prometheusConfigReloader:
    image:
      registry: microservices-demo-cn-shanghai.cr.volces.com
      repository: microservices-demo/microservices-demo/prometheus-config-reloader
      tag: v0.77.2
  admissionWebhooks:
    patch:
      image:
        registry: microservices-demo-cn-shanghai.cr.volces.com
        repository: microservices-demo/microservices-demo/kube-webhook-certgen
        tag: v20221220-controller-v1.5.1-58-g787ea74b6
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ===========================================
# Prometheus 配置
# ===========================================
prometheus:
  prometheusSpec:
    imagePullSecrets:
      - name: volc-registry-secret
    image:
      registry: microservices-demo-cn-shanghai.cr.volces.com
      repository: microservices-demo/microservices-demo/prometheus
      tag: v2.55.0

    # 数据保留时间
    retention: 15d
    retentionSize: "45GiB"

    # 开启 remote_write 接收端点 (关键！用于接收 OTEL Collector 的指标)
    enableRemoteWriteReceiver: true
    remoteWriteDashboards: true

    # 存储配置 - 使用 emptyDir (无 CSI 驱动时)
    storageSpec:
      emptyDir:
        medium: ""

    # 资源配置
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # 允许抓取所有 namespace 的 ServiceMonitor
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

    # 启用 PrometheusRule CRD
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}

    # 额外抓取配置 (可选)
    additionalScrapeConfigs: []

# ===========================================
# Grafana 配置
# ===========================================
grafana:
  enabled: true
  adminUser: admin
  adminPassword: "admin"

  imagePullSecrets:
    - name: volc-registry-secret

  # initContainer 镜像 (下载 dashboard 和修改数据目录权限)
  downloadDashboardsImage:
    registry: microservices-demo-cn-shanghai.cr.volces.com
    repository: microservices-demo/microservices-demo/curl
    tag: "7.85.0"

  initChownData:
    enabled: true
    image:
      registry: microservices-demo-cn-shanghai.cr.volces.com
      repository: microservices-demo/microservices-demo/busybox
      tag: "1.36.1"

  image:
    registry: microservices-demo-cn-shanghai.cr.volces.com
    repository: microservices-demo/microservices-demo/grafana
    tag: "11.2.2-security-01"

  # sidecar 镜像 (用于加载 ConfigMap 中的 dashboard/datasource)
  sidecar:
    image:
      registry: microservices-demo-cn-shanghai.cr.volces.com
      repository: microservices-demo/microservices-demo/k8s-sidecar
      tag: "1.28.0"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true

  # 服务类型：LoadBalancer 对外暴露 (火山引擎 VKE 会自动分配 CLB)
  service:
    type: LoadBalancer
    annotations: {}
    labels: {}

  # 持久化存储 (使用 emptyDir)
  persistence:
    enabled: false

  # 资源配置
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # 预配置数据源
  additionalDataSources:
    # Tempo - 链路追踪
    - name: Tempo
      type: tempo
      url: http://tempo.monitoring.svc:3100
      access: proxy
      uid: tempo
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          filterByTraceID: true
          mappedTags:
            - key: service.name
              value: service
        tracesToMetrics:
          datasourceUid: prometheus
          tags:
            - key: service.name
              value: service
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        search:
          hide: false

    # Loki - 日志 (auth_enabled: false, 单租户模式)
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
      uid: loki
      jsonData:
        maxLines: 1000
        derivedFields:
          # 从日志中提取 trace_id 跳转到 Tempo
          - datasourceUid: tempo
            matcherRegex: '"trace_id":"([a-f0-9]+)"'
            name: TraceID
            url: '$${__value.raw}'
          - datasourceUid: tempo
            matcherRegex: '"traceId":"([a-f0-9]+)"'
            name: TraceId
            url: '$${__value.raw}'

  # Dashboard Provider 配置
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: 'Online Boutique'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        - name: kubernetes
          orgId: 1
          folder: 'Kubernetes'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes

  # 预装 Grafana 社区大盘
  dashboards:
    kubernetes:
      # Kubernetes 集群资源总览 (from grafana.com)
      k8s-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      # Pod 资源使用
      k8s-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus
      # Node 资源使用
      k8s-nodes:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

  # Grafana 插件
  plugins:
    - grafana-clock-panel
    - grafana-piechart-panel

  # Grafana.ini 配置
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
    analytics:
      check_for_updates: false
    auth.anonymous:
      enabled: false
    auth.basic:
      enabled: true
    paths:
      data: /var/lib/grafana/data
      logs: /var/log/grafana
      plugins: /var/lib/grafana/plugins
      provisioning: /etc/grafana/provisioning

# ===========================================
# AlertManager 配置
# ===========================================
alertmanager:
  enabled: true
  alertmanagerSpec:
    imagePullSecrets:
      - name: volc-registry-secret
    image:
      registry: microservices-demo-cn-shanghai.cr.volces.com
      repository: microservices-demo/microservices-demo/alertmanager
      tag: v0.27.0

    # 存储配置 (使用 emptyDir)
    storage: null

    # 资源配置
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # 副本数
    replicas: 1

  # AlertManager 配置 (详细规则通过 PrometheusRule CRD 管理)
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - match:
            severity: critical
          receiver: 'critical'
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: 'warning'
    receivers:
      - name: 'null'
      - name: 'critical'
        webhook_configs:
          - url: 'http://dingtalk-webhook.monitoring.svc:8060/dingtalk/critical/send'
            send_resolved: true
      - name: 'warning'
        webhook_configs:
          - url: 'http://dingtalk-webhook.monitoring.svc:8060/dingtalk/warning/send'
            send_resolved: true

# ===========================================
# kube-state-metrics 配置
# ===========================================
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  image:
    registry: microservices-demo-cn-shanghai.cr.volces.com
    repository: microservices-demo/microservices-demo/kube-state-metrics
    tag: v2.13.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ===========================================
# node-exporter 配置
# ===========================================
nodeExporter:
  enabled: true

prometheus-node-exporter:
  image:
    registry: microservices-demo-cn-shanghai.cr.volces.com
    repository: microservices-demo/microservices-demo/node-exporter
    tag: v1.8.2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ===========================================
# 其他组件
# ===========================================
grafana-agent:
  enabled: false
grafana-agent-operator:
  enabled: false
kubelet:
  enabled: true
kubeControllerManager:
  enabled: false
coreDns:
  enabled: true
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Windows 监控 (如无 Windows 节点可禁用)
windowsMonitoring:
  enabled: false
