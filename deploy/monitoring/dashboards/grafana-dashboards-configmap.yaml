# -----------------------------------------------------------
# Dashboard 1: Online Boutique 微服务概览 (Prometheus)
# -----------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-microservices-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  microservices-overview.json: |
    {
      "annotations": {"list": [{"builtIn": 1,"datasource": {"type": "grafana","uid": "-- Grafana --"},"enable": true,"hide": true,"iconColor": "rgba(0, 211, 255, 1)","name": "Annotations & Alerts","type": "dashboard"}]},
      "description": "Online Boutique 微服务概览 Dashboard",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 0},"id": 1,"panels": [],"title": "关键指标","type": "row"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "thresholds"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null}]},"unit": "reqps"},"overrides": []},"gridPos": {"h": 4,"w": 6,"x": 0,"y": 1},"id": 2,"options": {"colorMode": "value","graphMode": "area","justifyMode": "auto","orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"textMode": "auto"},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\"}[5m]))","refId": "A"}],"title": "总请求率 (RPS)","type": "stat"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "thresholds"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "yellow","value": 0.01},{"color": "red","value": 0.05}]},"unit": "percentunit"},"overrides": []},"gridPos": {"h": 4,"w": 6,"x": 6,"y": 1},"id": 3,"options": {"colorMode": "value","graphMode": "area","justifyMode": "auto","orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"textMode": "auto"},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\"}[5m]))","refId": "A"}],"title": "错误率 (5xx)","type": "stat"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "thresholds"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "yellow","value": 500},{"color": "red","value": 1000}]},"unit": "ms"},"overrides": []},"gridPos": {"h": 4,"w": 6,"x": 12,"y": 1},"id": 4,"options": {"colorMode": "value","graphMode": "area","justifyMode": "auto","orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"textMode": "auto"},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "histogram_quantile(0.99, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{namespace=\"online-boutique\"}[5m])) by (le))","refId": "A"}],"title": "P99 延迟","type": "stat"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "thresholds"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null}]},"unit": "short"},"overrides": []},"gridPos": {"h": 4,"w": 6,"x": 18,"y": 1},"id": 5,"options": {"colorMode": "value","graphMode": "none","justifyMode": "auto","orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"textMode": "auto"},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(kube_deployment_status_replicas_available{namespace=\"online-boutique\"})","refId": "A"}],"title": "运行中 Pod 数","type": "stat"},
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 5},"id": 6,"panels": [],"title": "流量趋势","type": "row"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "line","fillOpacity": 10,"lineWidth": 1,"showPoints": "never"},"unit": "reqps"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 0,"y": 6},"id": 9,"options": {"legend": {"calcs": ["mean","max"],"displayMode": "table","placement": "right","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\"}[5m])) by (service_name)","legendFormat": "{{service_name}}","refId": "A"}],"title": "请求率 (按服务)","type": "timeseries"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "line","fillOpacity": 10,"lineWidth": 1,"showPoints": "never"},"max": 1,"min": 0,"unit": "percentunit"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 12,"y": 6},"id": 10,"options": {"legend": {"calcs": ["mean","max"],"displayMode": "table","placement": "right","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\",http_response_status_code=~\"5..\"}[5m])) by (service_name) / sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\"}[5m])) by (service_name)","legendFormat": "{{service_name}}","refId": "A"}],"title": "错误率 (按服务)","type": "timeseries"},
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 14},"id": 11,"panels": [],"title": "延迟分布","type": "row"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "line","fillOpacity": 10,"lineWidth": 1,"showPoints": "never"},"unit": "s"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 0,"y": 15},"id": 12,"options": {"legend": {"calcs": ["mean","max"],"displayMode": "table","placement": "right","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "histogram_quantile(0.50, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{namespace=\"online-boutique\"}[5m])) by (le, service_name)) / 1000","legendFormat": "P50 {{service_name}}","refId": "A"},{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{namespace=\"online-boutique\"}[5m])) by (le, service_name)) / 1000","legendFormat": "P95 {{service_name}}","refId": "B"},{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "histogram_quantile(0.99, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{namespace=\"online-boutique\"}[5m])) by (le, service_name)) / 1000","legendFormat": "P99 {{service_name}}","refId": "C"}],"title": "延迟百分位 P50/P95/P99","type": "timeseries"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "line","fillOpacity": 10,"lineWidth": 1,"showPoints": "never"},"unit": "short"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 12,"y": 15},"id": 13,"options": {"legend": {"calcs": ["mean","max"],"displayMode": "table","placement": "right","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\",rpc_grpc_status_code!=\"0\"}[5m])) by (service_name)","legendFormat": "gRPC错误 {{service_name}}","refId": "A"},{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(rate(traces_spanmetrics_calls_total{namespace=\"online-boutique\"}[5m])) by (service_name)","legendFormat": "gRPC总量 {{service_name}}","refId": "B"}],"title": "gRPC 请求率 (按服务)","type": "timeseries"},
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 23},"id": 14,"panels": [],"title": "资源使用","type": "row"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "line","fillOpacity": 10,"lineWidth": 1,"showPoints": "never"},"unit": "cores"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 0,"y": 24},"id": 15,"options": {"legend": {"calcs": ["mean","max"],"displayMode": "table","placement": "right","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"online-boutique\",container!=\"\",container!=\"POD\"}[5m])) by (container)","legendFormat": "{{container}}","refId": "A"}],"title": "CPU 使用 (按容器)","type": "timeseries"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "line","fillOpacity": 10,"lineWidth": 1,"showPoints": "never"},"unit": "bytes"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 12,"y": 24},"id": 16,"options": {"legend": {"calcs": ["mean","max"],"displayMode": "table","placement": "right","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "sum(container_memory_working_set_bytes{namespace=\"online-boutique\",container!=\"\",container!=\"POD\"}) by (container)","legendFormat": "{{container}}","refId": "A"}],"title": "内存使用 (按容器)","type": "timeseries"}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["online-boutique","microservices"],
      "templating": {"list": []},
      "time": {"from": "now-1h","to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "Online Boutique - 微服务概览",
      "uid": "online-boutique-overview",
      "version": 2,
      "weekStart": ""
    }
