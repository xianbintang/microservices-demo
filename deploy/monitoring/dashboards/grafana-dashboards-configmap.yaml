        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "thresholds"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "red","value": 0},{"color": "yellow","value": 60},{"color": "green","value": 80}]},"unit": "percent"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 0,"y": 24},"id": 12,"options": {"orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"showThresholdLabels": false,"showThresholdMarkers": true,"text": {}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "100 * count(ALERTS{alertstate=\"firing\"}) / 15","legendFormat": "告警覆盖率","refId": "A"}],"title": "告警覆盖率 (目标: 80%)","type": "gauge"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "bars","fillOpacity": 80,"lineWidth": 1,"showPoints": "never"},"unit": "short"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 12,"y": 24},"id": 13,"options": {"legend": {"calcs": ["mean","max"],"displayMode": "table","placement": "right","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "count(ALERTS{alertstate=\"firing\",namespace=\"online-boutique\"}) by (alertname)","legendFormat": "{{alertname}}","refId": "A"}],"title": "告警触发分布","type": "timeseries"},
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 32},"id": 14,"title": "关键告警场景检查","type": "row"},
        {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"custom": {"align": "auto","filterable": false}},"overrides": []},"gridPos": {"h": 10,"w": 24,"x": 0,"y": 33},"id": 15,"options": {"showHeader": true,"sortBy": [{ "desc": true,"displayName": "已覆盖"}],"wrapText": false},"transformations": [{"id": "organize","options": {"excludeByName": {"Time": false}}}],"targets": [{"datasource": {"type": "prometheus","uid": "prometheus"},"expr": "ALERTS","format": "table","refId": "A"}],"title": "告警场景检查表","type": "table"}
      ],
      "refresh": "30s",
