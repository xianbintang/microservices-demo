# -----------------------------------------------------------
# Dashboard 2: Online Boutique 日志大盘 (Loki)
# -----------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  online-boutique-logs.json: |
    {
      "description": "Online Boutique 日志大盘 - 基于 Loki",
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 0},"id": 1,"title": "日志概览","type": "row"},
        {"datasource": {"type": "loki","uid": "loki"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "bars","fillOpacity": 80,"lineWidth": 1,"showPoints": "never"},"unit": "short"},"overrides": []},"gridPos": {"h": 5,"w": 24,"x": 0,"y": 1},"id": 2,"options": {"legend": {"calcs": [],"displayMode": "list","placement": "bottom","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "loki","uid": "loki"},"expr": "sum(count_over_time({namespace=\"online-boutique\"}[1m])) by (app)","legendFormat": "{{app}}","refId": "A"}],"title": "日志量 (按服务)","type": "timeseries"},
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 6},"id": 10,"title": "错误日志","type": "row"},
        {"datasource": {"type": "loki","uid": "loki"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "bars","fillOpacity": 80,"lineWidth": 1,"showPoints": "never"},"unit": "short"},"overrides": []},"gridPos": {"h": 5,"w": 12,"x": 0,"y": 7},"id": 11,"options": {"legend": {"calcs": [],"displayMode": "list","placement": "bottom","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "loki","uid": "loki"},"expr": "sum(count_over_time({namespace=\"online-boutique\"} |= \"error\" [1m])) by (app)","legendFormat": "{{app}}","refId": "A"}],"title": "错误日志量 (按服务)","type": "timeseries"},
        {"datasource": {"type": "loki","uid": "loki"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"custom": {"drawStyle": "bars","fillOpacity": 80,"lineWidth": 1,"showPoints": "never"},"unit": "short"},"overrides": []},"gridPos": {"h": 5,"w": 12,"x": 12,"y": 7},"id": 12,"options": {"legend": {"calcs": [],"displayMode": "list","placement": "bottom","showLegend": true},"tooltip": {"mode": "multi","sort": "none"}},"targets": [{"datasource": {"type": "loki","uid": "loki"},"expr": "sum(count_over_time({namespace=\"online-boutique\"} |= \"panic\" [1m])) by (app) + sum(count_over_time({namespace=\"online-boutique\"} |= \"fatal\" [1m])) by (app)","legendFormat": "{{app}}","refId": "A"}],"title": "Panic/Fatal 日志量","type": "timeseries"},
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 12},"id": 20,"title": "实时日志流","type": "row"},
        {"datasource": {"type": "loki","uid": "loki"},"gridPos": {"h": 12,"w": 24,"x": 0,"y": 13},"id": 21,"options": {"dedupStrategy": "none","enableLogDetails": true,"prettifyLogMessage": false,"showCommonLabels": false,"showLabels": false,"showTime": true,"sortOrder": "Descending","wrapLogMessage": false},"targets": [{"datasource": {"type": "loki","uid": "loki"},"expr": "{namespace=\"online-boutique\", app=~\"$service\"} |= \"$search\"","refId": "A"}],"title": "日志流 (可过滤)","type": "logs"},
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 25},"id": 30,"title": "含 TraceID 的错误日志 (可跳转 Tempo)","type": "row"},
        {"datasource": {"type": "loki","uid": "loki"},"gridPos": {"h": 10,"w": 24,"x": 0,"y": 26},"id": 31,"options": {"dedupStrategy": "none","enableLogDetails": true,"prettifyLogMessage": false,"showCommonLabels": false,"showLabels": false,"showTime": true,"sortOrder": "Descending","wrapLogMessage": false},"targets": [{"datasource": {"type": "loki","uid": "loki"},"expr": "{namespace=\"online-boutique\"} |= \"error\" | json | trace_id != \"\"","refId": "A"}],"title": "含 TraceID 的错误日志","type": "logs"}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["online-boutique","logs","loki"],
      "templating": {
        "list": [
          {"current": {},"datasource": {"type": "loki","uid": "loki"},"definition": "label_values({namespace=\"online-boutique\"},app)","hide": 0,"includeAll": true,"multi": true,"name": "service","options": [],"query": "label_values({namespace=\"online-boutique\"},app)","refresh": 2,"sort": 1,"type": "query","label": "服务"},
          {"current": {"selected": false,"text": "","value": ""},"hide": 0,"name": "search","options": [{"selected": true,"text": "","value": ""}],"query": "","type": "textbox","label": "搜索关键词"}
        ]
      },
      "time": {"from": "now-1h","to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "Online Boutique - 日志大盘",
      "uid": "online-boutique-logs",
      "version": 1
    }
