# -----------------------------------------------------------
# Dashboard 3: 应用告警监控大盘
# -----------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app-monitoring
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  app-monitoring.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "应用告警监控大盘 — 实时展示 Pod 健康、告警触发、性能影响与资源压力",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": ["monitoring", "sre"],
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "应用告警监控",
      "uid": "app-monitoring-v1",
      "version": 1,
      "panels": [
    
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 100,
          "title": "告警概览",
          "type": "row"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "fixed", "fixedColor": "red"},
              "custom": {
                "fillOpacity": 80,
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "lineWidth": 0,
                "spanNulls": false
              },
              "mappings": [
                {"options": {"0": {"color": "green", "index": 0, "text": "inactive"}, "1": {"color": "red", "index": 1, "text": "firing"}}, "type": "value"}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 1},
          "id": 20,
          "options": {
            "alignValue": "left",
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
            "mergeValues": true,
            "rowHeight": 0.9,
            "showValue": "auto",
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "ALERTS{alertname=~\"App.*\", alertstate=\"firing\"} == 1",
              "legendFormat": "{{alertname}} [{{severity}}] {{pod}}{{label_app}}{{service_name}} | src={{prometheus}}/{{prometheus_replica}}",
              "refId": "A"
            }
          ],
          "title": "历史告警时间线 (时间窗口内)",
          "type": "state-timeline"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"fixedColor": "red", "mode": "fixed"},
              "mappings": [{"options": {"0": {"color": "green", "index": 0, "text": "0"}}, "type": "value"}],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 9},
          "id": 1,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "count(ALERTS{alertname=~\"App.*\", severity=\"critical\", alertstate=\"firing\"}) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Critical 告警",
          "type": "stat"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"fixedColor": "orange", "mode": "fixed"},
              "mappings": [{"options": {"0": {"color": "green", "index": 0, "text": "0"}}, "type": "value"}],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 8, "x": 8, "y": 9},
          "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "count(ALERTS{alertname=~\"App.*\", severity=\"warning\", alertstate=\"firing\"}) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Warning 告警",
          "type": "stat"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [{"options": {"0": {"color": "green", "index": 0, "text": "无告警"}}, "type": "value"}],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 9},
          "id": 3,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "count(ALERTS{alertname=~\"App.*\", alertstate=\"firing\"}) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "活跃告警总数",
          "type": "stat"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "custom": {"align": "left", "cellOptions": {"type": "auto"}, "filterable": true, "inspect": false},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "alertname"},
                "properties": [{"id": "displayName", "value": "告警名称"}, {"id": "custom.width", "value": 220}]
              },
              {
                "matcher": {"id": "byName", "options": "severity"},
                "properties": [
                  {"id": "displayName", "value": "严重级别"},
                  {"id": "custom.width", "value": 100},
                  {"id": "custom.cellOptions", "value": {"type": "color-background"}},
                  {"id": "mappings", "value": [
                    {"options": {"critical": {"color": "red", "index": 0}}, "type": "value"},
                    {"options": {"warning": {"color": "orange", "index": 1}}, "type": "value"}
                  ]}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "pod"},
                "properties": [{"id": "displayName", "value": "Pod"}, {"id": "custom.width", "value": 280}]
              },
              {
                "matcher": {"id": "byName", "options": "namespace"},
                "properties": [{"id": "displayName", "value": "命名空间"}, {"id": "custom.width", "value": 140}]
              },
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [{"id": "displayName", "value": "状态"}, {"id": "custom.width", "value": 80}]
              }
            ]
          },
          "gridPos": {"h": 7, "w": 24, "x": 0, "y": 13},
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "footer": {"countRows": false, "fields": "", "reducer": ["sum"], "show": false},
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "严重级别"}]
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "ALERTS{alertname=~\"App.*\", alertstate=\"firing\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "活跃告警详情",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "alertstate": true, "job": true, "prometheus": true, "prometheus_replica": true, "condition": true},
                "renameByName": {}
              }
            }
          ],
          "type": "table"
        },
    
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 20},
          "id": 101,
          "title": "Pod 健康状态",
          "type": "row"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 20, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "lineInterpolation": "stepAfter", "lineWidth": 2, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": true, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}},
              "mappings": [{"options": {"0": {"color": "red", "index": 0, "text": "NotReady"}, "1": {"color": "green", "index": 1, "text": "Ready"}}, "type": "value"}],
              "max": 1,
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21},
          "id": 5,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_pod_status_ready{namespace=\"online-boutique\", condition=\"true\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Pod Ready 状态 (1=Ready, 0=NotReady)",
          "type": "timeseries"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "bars", "fillOpacity": 60, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "line", "steps": [{"color": "transparent", "value": null}, {"color": "orange", "value": 1}]}},
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21},
          "id": 6,
          "options": {"legend": {"calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"online-boutique\"}[5m])",
              "legendFormat": "{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "title": "Pod 重启次数 (5m 窗口)",
          "type": "timeseries"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisBorderShow": false, "axisColorMode": "text", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 30, "lineInterpolation": "stepAfter", "lineWidth": 2, "showPoints": "never", "spanNulls": true, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "dashed"}},
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 29},
          "id": 7,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "kube_pod_container_status_waiting_reason{namespace=\"online-boutique\", reason=\"CrashLoopBackOff\"}",
              "legendFormat": "{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "title": "CrashLoopBackOff 状态 (1=异常)",
          "type": "timeseries"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisBorderShow": false, "axisColorMode": "text", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 20, "lineInterpolation": "stepAfter", "lineWidth": 2, "showPoints": "never", "spanNulls": true, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}},
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0}, {"color": "green", "value": 1}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 29},
          "id": 8,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (namespace, label_app) (\n  kube_pod_status_ready{namespace=\"online-boutique\", condition=\"true\"}\n  * on(namespace, pod) group_left(label_app)\n  kube_pod_labels{namespace=\"online-boutique\"}\n)",
              "legendFormat": "{{label_app}}",
              "refId": "A"
            }
          ],
          "title": "Service Ready Pod 数量",
          "type": "timeseries"
        },
    
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 37},
          "id": 102,
          "title": "性能影响",
          "type": "row"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisBorderShow": false, "axisColorMode": "text", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 20, "lineInterpolation": "linear", "lineWidth": 2, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "dashed"}},
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.05}, {"color": "red", "value": 0.1}]},
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 38},
          "id": 9,
          "options": {"legend": {"calcs": ["mean", "lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "(\n  sum(rate(traces_spanmetrics_calls_total{service_name=~\".+\"}[5m])) by (service_name)\n  - sum(rate(traces_spanmetrics_calls_total{service_name=~\".+\", status_code=\"STATUS_CODE_OK\"}[5m])) by (service_name)\n) / sum(rate(traces_spanmetrics_calls_total{service_name=~\".+\"}[5m])) by (service_name)",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "服务错误率 (阈值: 10%)",
          "type": "timeseries"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisBorderShow": false, "axisColorMode": "text", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "linear", "lineWidth": 2, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "dashed"}},
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1000}, {"color": "red", "value": 2000}]},
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 38},
          "id": 10,
          "options": {"legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{service_name=~\".+\"}[5m])) by (le, service_name))",
              "legendFormat": "P95 {{service_name}}",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.99, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{service_name=~\".+\"}[5m])) by (le, service_name))",
              "legendFormat": "P99 {{service_name}}",
              "refId": "B"
            }
          ],
          "title": "P95/P99 延迟 (阈值: 2000ms)",
          "type": "timeseries"
        },
    
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 46},
          "id": 103,
          "title": "资源压力",
          "type": "row"
        },
    
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"axisBorderShow": false, "axisColorMode": "text", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "linear", "lineWidth": 1, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "dashed"}},
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.3}, {"color": "red", "value": 0.5}]},
              "unit": "cores"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 47},
          "id": 11,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
