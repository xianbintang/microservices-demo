# -----------------------------------------------------------
# Dashboard 4: 告警状态大盘
# -----------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alerts
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  alerting-overview.json: |
    {
      "description": "告警状态总览大盘",
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {"collapsed": false,"gridPos": {"h": 1,"w": 24,"x": 0,"y": 0},"id": 1,"title": "当前告警状态","type": "row"},
