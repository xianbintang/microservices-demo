# Chaos Mesh Helm Values

# 命名空间配置
namespace: monitoring

# 是否为集群范围（false 表示限制在特定命名空间）
clusterScoped: false

# Controller 配置
controllerManager:
  # 副本数（高可用）
  replicas: 2

  # 资源限制
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Chaos Daemon 配置
chaosDaemon:
  # 副本数（每个节点运行）
  replicas: 1

  # 资源限制
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Dashboard 配置
dashboard:
  # 启用 Web UI
  enabled: true

  # 副本数
  replicas: 1

  # 资源限制
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # 服务类型
  service:
    type: ClusterIP

# Webhook 配置
webhook:
  # 副本数
  replicas: 2

  # 资源限制
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # 准入 webhook 验证配置
  admission:
    enabled: true
    # 验证实验参数是否超过安全限制
    validateLimits: true

# 安全配置
security:
  # 是否启用 RBAC
  enableRBAC: true

  # 是否启用 Service Account
  enableServiceAccount: true

# 告警覆盖度检查
alertCoverage:
  # 覆盖率阈值（%）
  threshold: 80

  # 关键场景要求
  criticalScenarios:
    - PodNotReady
    - PodDown
    - ServiceDown
    - HighLatency
    - HighErrorRate
    - High5xxRate
    - HighCPUUsage
    - HighMemoryUsage

# 实验安全限制
limits:
  # 最大实验时长
  maxDuration: 10m

  # 最大网络延迟
  maxNetworkDelay: 2000ms

  # 最大网络丢包率（%）
  maxNetworkLoss: 20

  # 最大 CPU 压力（%）
  maxCPUStress: 90

  # 最大内存压力（%）
  maxMemoryStress: 80

  # 最大损坏 Pod 数量（百分比）
  maxPodFailureRate: 50

  # 最大 IO 压力（%）
  maxIOStress: 80

# 允许的命名空间（白名单）
allowedNamespaces:
  - online-boutique

# 禁止的命名空间（黑名单）
blockedNamespaces:
  - monitoring
  - kube-system
  - kube-public

# 镜像拉取密钥（如需要）
imagePullSecrets: []

# 环境变量
env:
  # 日志级别
  - name: CHAOS_MESH_LOG_LEVEL
    value: info