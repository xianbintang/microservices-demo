# Tempo Helm Chart Values
# 分布式追踪后端，接收 OTLP 数据
# Helm version: 1.10.3
# 镜像仓库: microservices-demo-cn-shanghai.cr.volces.com/microservices-demo/microservices-demo

# ===========================================
# Tempo 配置
# ===========================================
tempo:
  repository: microservices-demo-cn-shanghai.cr.volces.com/microservices-demo/microservices-demo/tempo
  tag: "2.5.0"
  pullPolicy: IfNotPresent
  pullSecrets:
    - volc-registry-secret

  # Ingester 配置
  ingester:
    max_block_duration: 5m
    trace_idle_period: 10s
    complete_block_timeout: 30m
    flush_check_period: 10s

  # Compactor 配置
  compactor:
    compaction:
      block_retention: 72h
      chunk_size_bytes: 1.6e+07
      flush_size_bytes: 1.6e+07
    ring:
      kvstore:
        store: memberlist

  # Querier 配置
  # 单体模式下 querier 和 query-frontend 在同一进程，用 localhost:9095 连接
  querier:
    frontend_worker:
      frontend_address: localhost:9095
    max_concurrent_queries: 20

  # Query Frontend 配置
  queryFrontend:
    search:
      concurrent_jobs: 2000
      max_duration: 168h
      # 增大每个 job 处理的最大字节数，减少拆分次数
      target_bytes_per_job: 104857600  # 100MB

  # Distributor 配置
  distributor:
    ring:
      kvstore:
        store: memberlist
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  # Storage 配置
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
      # 启用 snappy 压缩：减少 50~70% 磁盘 I/O，显著提升查询速度
      block:
        encoding: snappy
        bloom_filter_false_positive: 0.05
        bloom_filter_shard_size_bytes: 100000

  # Memberlist 配置
  memberlist:
    abort_if_cluster_join_fails: false
    join_members:
      - tempo-gossip-ring

# ===========================================
# 部署模式: 单体模式
# ===========================================
deploymentMode: SingleBinary

# ===========================================
# 单体模式配置
# ===========================================
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  extraEnv:
    - name: GOMEMLIMIT
      value: "1800MiB"
  persistence:
    enabled: false

# ===========================================
# 禁用分布式模式组件
# ===========================================
distributor:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
compactor:
  replicas: 0

gateway:
  enabled: false

# ===========================================
# Service 配置
# ===========================================
service:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: tempo-query
      port: 3100
      targetPort: 3100
      protocol: TCP

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

test:
  enabled: false