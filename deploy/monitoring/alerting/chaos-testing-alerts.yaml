apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-monitoring-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: app.pod.alerts
      interval: 30s
      rules:
        - alert: AppPodRestart
          annotations:
            description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted in last 5m.'
            summary: Pod restarted.
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"online-boutique"}[5m]) > 0
          for: 30s
          labels:
            severity: warning

        - alert: AppPodNotReady
          annotations:
            description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready.'
            summary: Pod not ready.
          expr: |
            kube_pod_status_ready{namespace="online-boutique", condition="true"} == 0
          for: 30s
          labels:
            severity: critical

        - alert: AppPodDown
          annotations:
            description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} is in Failed/Unknown phase.'
            summary: Pod down.
          expr: |
            kube_pod_status_phase{namespace="online-boutique", phase=~"Failed|Unknown"} > 0
          for: 30s
          labels:
            severity: critical

        - alert: AppPodCrashLoopBackOff
          annotations:
            description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff.'
            summary: Pod in CrashLoopBackOff.
          expr: |
            kube_pod_container_status_waiting_reason{namespace="online-boutique", reason="CrashLoopBackOff"} == 1
          for: 30s
          labels:
            severity: critical

        - alert: AppOOMKilled
          annotations:
            description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled.'
            summary: Pod OOM killed.
          expr: |
            kube_pod_container_status_last_terminated_reason{namespace="online-boutique", reason="OOMKilled"} == 1
          for: 0s
          labels:
            severity: critical

        # 修复: 按 label_app 聚合，join kube_pod_labels 获取 app 标签，避免每 Pod 单独触发
        - alert: AppServiceDown
          annotations:
            description: 'All pods for app {{ $labels.label_app }} in namespace {{ $labels.namespace }} are not ready.'
            summary: Service has no ready pods.
          expr: |
            (
              sum by (namespace, label_app) (
                kube_pod_status_ready{namespace="online-boutique", condition="true"}
                * on(namespace, pod) group_left(label_app)
                kube_pod_labels{namespace="online-boutique"}
              )
            ) == 0
          for: 30s
          labels:
            severity: critical

    - name: app.latency.alerts
      interval: 30s
      rules:
        - alert: AppHighLatency
          annotations:
            description: '服务 {{ $labels.service_name }} P95 延迟过高: {{ $value }}ms'
            summary: High latency detected.
          expr: |
            histogram_quantile(0.95, sum(rate(traces_spanmetrics_duration_milliseconds_bucket{service_name=~".*"}[5m])) by (le, service_name)) > 100
          for: 30s
          labels:
            severity: warning

        - alert: AppHighErrorRate
          annotations:
            description: '服务 {{ $labels.service_name }} 错误率过高: {{ $value | humanizePercentage }}'
            summary: High error rate detected.
          expr: |
            (sum(rate(traces_spanmetrics_calls_total{service_name=~".*"}[5m])) by (service_name)
            - sum(rate(traces_spanmetrics_calls_total{service_name=~".*",status_code="STATUS_CODE_OK"}[5m])) by (service_name))
            / sum(rate(traces_spanmetrics_calls_total{service_name=~".*"}[5m])) by (service_name) > 0.1
          for: 30s
          labels:
            severity: critical

    - name: app.resource.alerts
      interval: 30s
      rules:
        - alert: AppCPUThrottling
          annotations:
            description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} CPU throttling rate > 50%.'
            summary: High CPU throttling detected.
          expr: |
            (
              rate(container_cpu_cfs_throttled_periods_total{namespace="online-boutique", container!=""}[5m])
              /
              rate(container_cpu_cfs_periods_total{namespace="online-boutique", container!=""}[5m])
            ) > 0.5
          for: 30s
          labels:
            severity: warning

        - alert: AppHighCPUUsage
          annotations:
            description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} CPU usage > 0.5 core.'
            summary: High CPU usage detected.
          expr: |
            sum by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{namespace="online-boutique", container!=""}[5m])
            ) > 0.5
          for: 30s
          labels:
            severity: warning

        - alert: AppHighMemoryUsage
          annotations:
            description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} memory working set > 400MiB.'
            summary: High memory usage detected.
          expr: |
            sum by (namespace, pod, container) (
              container_memory_working_set_bytes{namespace="online-boutique", container!=""}
            ) > 400 * 1024 * 1024
          for: 30s
          labels:
            severity: warning
