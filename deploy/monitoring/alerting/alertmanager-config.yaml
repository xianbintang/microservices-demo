# AlertManager 额外配置
# 通过 Secret 注入，与 kube-prometheus-stack values 中的 config 合并

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kube-prometheus-stack-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      # SMTP 配置 (可选，用于邮件通知)
      # smtp_smarthost: 'smtp.example.com:587'
      # smtp_from: 'alertmanager@example.com'
      # smtp_auth_username: 'alertmanager@example.com'
      # smtp_auth_password: 'password'

    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default'
      routes:
        # Critical 级别告警 -> 立即通知 + 高频重复
        - matchers:
            - severity="critical"
          receiver: 'critical'
          group_wait: 10s
          repeat_interval: 1h
          continue: true

        # Warning 级别告警 -> 正常频率
        - matchers:
            - severity="warning"
          receiver: 'warning'
          repeat_interval: 6h

        # online-boutique 业务告警
        - matchers:
            - namespace="online-boutique"
          receiver: 'online-boutique'
          group_wait: 30s

    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'http://dingtalk-webhook:8060/dingtalk/warning/send'
            send_resolved: true

      - name: 'critical'
        webhook_configs:
          - url: 'http://dingtalk-webhook:8060/dingtalk/critical/send'
            send_resolved: true

      - name: 'warning'
        webhook_configs:
          - url: 'http://dingtalk-webhook:8060/dingtalk/warning/send'
            send_resolved: true

      - name: 'online-boutique'
        webhook_configs:
          - url: 'http://dingtalk-webhook:8060/dingtalk/online-boutique/send'
            send_resolved: true

    inhibit_rules:
      # 当服务 down 时，抑制该服务的其他告警
      - source_matchers:
          - alertname="ServiceDown"
        target_matchers:
          - namespace="online-boutique"
        equal: ['namespace', 'deployment']

      # 当节点 down 时，抑制该节点的其他告警
      - source_matchers:
          - alertname="NodeDown"
        target_matchers:
          - severity="warning"
        equal: ['node']