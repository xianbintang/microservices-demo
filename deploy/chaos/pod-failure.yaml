# Pod Failure Experiment Template
# 测试 Pod 故障时的系统弹性和自愈能力

apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-experiment
  namespace: online-boutique
  labels:
    chaos.mes.org/type: pod-failure
    chaos.mes.org/namespace: online-boutique
  annotations:
    chaos.mes.org/description: "Pod failure experiment - kills a Pod to test self-healing"
    chaos.mes.org/observability: "enable"
    chaos.mes.org/expected-alerts: "PodNotReady,ServiceUnavailable"
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: frontend
  duration: "2m"
