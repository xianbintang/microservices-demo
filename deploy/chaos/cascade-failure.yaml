---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: cascade-pod-kill
  namespace: monitoring
  labels:
    chaos.mes.org/type: cascade-failure
    chaos.mes.org/part: "1/3"
spec:
  action: pod-kill
  mode: one
  value: "1"
  duration: "2m"
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app.kubernetes.io/name: adservice
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: cascade-network-delay
  namespace: monitoring
  labels:
    chaos.mes.org/type: cascade-failure
    chaos.mes.org/part: "2/3"
spec:
  action: delay
  mode: one
  value: "1"
  duration: "3m"
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app.kubernetes.io/name: recommendationservice
  delay:
    latency: 500ms
    jitter: 50ms
  direction: to
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cascade-memory-stress
  namespace: monitoring
  labels:
    chaos.mes.org/type: cascade-failure
    chaos.mes.org/part: "3/3"
spec:
  mode: one
  value: "1"
  duration: "4m"
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app.kubernetes.io/name: checkoutservice
  stressors:
    memory:
      size: "80%"