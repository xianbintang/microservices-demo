apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: dependency-failure
  namespace: monitoring
  annotations:
    chaos.mes.org/description: "Service dependency failure experiment - adservice"
    chaos.mes.org/observability: "enable"
    chaos.mes.org/expected-alerts: "KubePodNotReady,TargetDown"
  labels:
    chaos.mes.org/type: dependency-failure
    chaos.mes.org/namespace: online-boutique
    chaos.mes.org/dependency-service: adservice
spec:
  action: pod-kill
  mode: one
  value: "1"
  duration: "2m"
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: adservice
