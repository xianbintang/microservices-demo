# Dependency Failure Experiment Template
# 测试服务依赖故障时的系统弹性和降级能力

apiVersion: chaos-mesh.org/v1alpha1
kind: PodNetworkChaos
metadata:
  name: dependency-failure-experiment
  namespace: monitoring
  labels:
    chaos.mes.org/type: dependency-failure
    chaos.mes.org/namespace: online-boutique
  annotations:
    chaos.mes.org/description: "Dependency failure experiment - isolates a service to simulate dependency unavailability"
    chaos.mes.org/observability: "enable"
    chaos.mes.org/expected-alerts: "ServiceUnavailable,DependencyErrorRateHigh,CircuitBreakerOpen"
spec:
  action: partition
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      # 依赖服务，例如:
      app: adservice
  direction: both
  duration: "3m"
