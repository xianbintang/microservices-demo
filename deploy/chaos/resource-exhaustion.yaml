# Resource Exhaustion Experiment Template
# 测试资源耗尽时的系统弹性和降级表现

apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: resource-exhaustion-experiment
  namespace: monitoring
  labels:
    chaos.mes.org/type: resource-exhaustion
    chaos.mes.org/namespace: online-boutique
  annotations:
    chaos.mes.org/description: "Resource exhaustion experiment - applies CPU or memory stress to test graceful degradation"
    chaos.mes.org/observability: "enable"
    chaos.mes.org/expected-alerts: "HighCPUUsage,HighMemoryUsage,PodOOMKilled,CPUThrottlingHigh"
spec:
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      # 可以指定服务，例如:
      # app: checkoutservice
  # CPU 压力配置
  stressors:
    cpu:
      workers: 2
      load: 90
    # 内存压力配置（可选择其一或两者都启用）
    memory:
      size: "80%"
  # 持续时间
  duration: "5m"

---
# 纯 CPU 压力实验
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-experiment
  namespace: monitoring
  labels:
    chaos.mes.org/type: cpu-stress
    chaos.mes.org/namespace: online-boutique
  annotations:
    chaos.mes.org/description: "CPU stress experiment - tests system under high CPU load"
    chaos.mes.org/observability: "enable"
    chaos.mes.org/expected-alerts: "HighCPUUsage,CPUThrottlingHigh"
spec:
  mode: one
  selector:
    namespaces:
      - online-boutique
  stressors:
    cpu:
      workers: 2
      load: 90
  duration: "5m"

---
# 纯内存压力实验
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-experiment
  namespace: monitoring
  labels:
    chaos.mes.org/type: memory-stress
    chaos.mes.org/namespace: online-boutique
  annotations:
    chaos.mes.org/description: "Memory stress experiment - tests system under high memory pressure"
    chaos.mes.org/observability: "enable"
    chaos.mes.org/expected-alerts: "HighMemoryUsage,PodOOMKilled"
spec:
  mode: one
  selector:
    namespaces:
      - online-boutique
  stressors:
    memory:
      size: "80%"
  duration: "5m"
