# Cascade Failure Experiment Template
# 测试多个故障同时发生时的系统弹性和隔离能力

# 故障 1: adservice Pod 故障
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: cascade-pod-failure-adservice
  namespace: chaos-mesh
  labels:
    chaos.mes.org/type: cascade-failure
    chaos.mes.org/namespace: online-boutique
    chaos.mes.org/cascade-id: "default"
    chaos.mes.org/fault-order: "1"
  annotations:
    chaos.mes.org/description: "Cascade failure - adservice pod kill"
    chaos.mes.org/observability: "enable"
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: adservice
  duration: "2m"

---
# 故障 2: recommendationservice 网络隔离（partition 模式，兼容 kind ipset 限制）
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: cascade-network-partition-recommendation
  namespace: chaos-mesh
  labels:
    chaos.mes.org/type: cascade-failure
    chaos.mes.org/namespace: online-boutique
    chaos.mes.org/cascade-id: "default"
    chaos.mes.org/fault-order: "2"
  annotations:
    chaos.mes.org/description: "Cascade failure - recommendationservice network partition"
    chaos.mes.org/observability: "enable"
spec:
  action: partition
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: recommendationservice
  direction: both
  duration: "3m"

---
# 故障 3: checkoutservice 内存压力
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cascade-memory-stress-checkout
  namespace: chaos-mesh
  labels:
    chaos.mes.org/type: cascade-failure
    chaos.mes.org/namespace: online-boutique
    chaos.mes.org/cascade-id: "default"
    chaos.mes.org/fault-order: "3"
  annotations:
    chaos.mes.org/description: "Cascade failure - checkoutservice memory stress"
    chaos.mes.org/observability: "enable"
spec:
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: checkoutservice
  stressors:
    memory:
      size: "512MiB"
  duration: "4m"

---
# 级联故障摘要 (用于文档和报告)
# 实验包含 3 个同时触发的故障:
# 1. adservice: PodKill (2m)
# 2. recommendationservice: NetworkPartition (3m) — partition 兼容 kind
# 3. checkoutservice: MemoryStress 512MiB (4m)
# 预期告警: ChaosPodNotReady, ChaosHighMemoryUsage
