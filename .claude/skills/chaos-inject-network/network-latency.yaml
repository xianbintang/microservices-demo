# Network Latency Experiment Template
# 测试网络延迟时的系统弹性和性能表现
# kind 环境: 使用 action: partition（delay 在 kind 下因 ipset 限制失败）
# 非 kind 环境: 可改为 action: delay 并添加 delay: 段

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-latency-experiment
  namespace: chaos-mesh
  labels:
    chaos.mes.org/type: network-latency
    chaos.mes.org/namespace: online-boutique
  annotations:
    chaos.mes.org/description: "Network latency experiment - partitions target pod to simulate network failure"
    chaos.mes.org/observability: "enable"
    chaos.mes.org/expected-alerts: "ChaosHighLatency,ChaosHighErrorRate"
spec:
  action: partition
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: recommendationservice
  direction: both
  duration: "3m"
