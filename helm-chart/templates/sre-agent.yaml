{{- if .Values.sreAgent.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sreAgent.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-controller-manager
  namespace: {{ .Values.sreAgent.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-manager-role
rules:
# Allow managing SRE Agent custom resources
- apiGroups: ["sre.agent.io"]
  resources: ["incidents", "incidents/status", "incidents/finalizers"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["sre.agent.io"]
  resources: ["faultinjections", "faultinjections/status", "faultinjections/finalizers"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["sre.agent.io"]
  resources: ["remediations", "remediations/status", "remediations/finalizers"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["sre.agent.io"]
  resources: ["playbooks", "playbooks/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["sre.agent.io"]
  resources: ["detectionrules", "detectionrules/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

# Allow Chaos Mesh integration
- apiGroups: ["chaos-mesh.org"]
  resources: ["podchaos", "podchaos/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["chaos-mesh.org"]
  resources: ["networkchaos", "networkchaos/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["chaos-mesh.org"]
  resources: ["stresschaos", "stresschaos/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["chaos-mesh.org"]
  resources: ["httpchaos", "httpchaos/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["chaos-mesh.org"]
  resources: ["grpcchaos", "grpcchaos/status"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

# Allow managing Deployments and ReplicaSets (for remediation actions)
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]

# Allow managing Pods, Services, Endpoints, ConfigMaps
- apiGroups: [""]
  resources: ["pods", "pods/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "update", "patch"]

# Allow creating Events (audit logging)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

# Allow reading Namespace
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

# Allow reading Secrets (for service account tokens)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent-manager-role
subjects:
- kind: ServiceAccount
  name: sre-agent-controller-manager
  namespace: {{ .Values.sreAgent.namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.sreAgent.name }}
  namespace: {{ .Values.sreAgent.namespace }}
  labels:
    control-plane: controller-manager
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: {{ .Values.sreAgent.metrics.port }}
    targetPort: metrics
  - name: healthz
    port: {{ .Values.sreAgent.healthCheck.port }}
    targetPort: healthz
  selector:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.sreAgent.name }}
  namespace: {{ .Values.sreAgent.namespace }}
  labels:
    control-plane: controller-manager
spec:
  replicas: {{ .Values.sreAgent.replicas }}
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: sre-agent-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ .Values.sreAgent.image.repository }}:{{ .Values.sreAgent.image.tag }}"
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        {{- if .Values.sreAgent.leaderElection.enabled }}
        - --leader-elect
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
{{ toYaml .Values.sreAgent.resources | indent 10 }}
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: {{ .Values.sreAgent.metrics.port }}
          name: metrics
          protocol: TCP
        - containerPort: {{ .Values.sreAgent.healthCheck.port }}
          name: healthz
          protocol: TCP
        env:
        - name: PROMETHEUS_URL
          value: {{ .Values.sreAgent.prometheus.url | quote }}
        {{- if .Values.sreAgent.chaosMesh.enabled }}
        - name: CHAOS_MESH_NAMESPACE
          value: {{ .Values.sreAgent.chaosMesh.namespace | quote }}
        {{- end }}
        {{- if .Values.sreAgent.openTelemetry.enabled }}
        - name: OTEL_ENDPOINT
          value: {{ .Values.sreAgent.openTelemetry.endpoint | quote }}
        {{- end }}
      terminationGracePeriodSeconds: 10
{{- end }}