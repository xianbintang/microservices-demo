# 自建可观测性栈 OpenTelemetry Collector
# 用于收集微服务的 Traces、Metrics、Logs，并导出到自建后端
# 与 volcengineAPM 互斥，或双写用于验证

{{- if .Values.selfHostedObservability.enabled }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-self
  namespace: {{.Release.Namespace}}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-self
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-collector-self
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-self
  template:
    metadata:
      labels:
        app: otel-collector-self
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: otel-collector-self
      {{- else }}
      serviceAccountName: default
      {{- end }}
      {{- if .Values.selfHostedObservability.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.selfHostedObservability.imagePullSecret }}
      {{- end }}
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
      - name: otel-collector
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: {{ .Values.images.repository }}/opentelemetry-collector-contrib:0.144.0
        args:
        - --config=/conf/collector-config.yaml
        ports:
        - name: grpc-otlp
          containerPort: 4317
          protocol: TCP
        - name: http-otlp
          containerPort: 4318
          protocol: TCP
        volumeMounts:
        - name: collector-config
          mountPath: /conf
        resources:
          requests:
            cpu: {{ .Values.selfHostedObservability.resources.requests.cpu }}
            memory: {{ .Values.selfHostedObservability.resources.requests.memory }}
          limits:
            cpu: {{ .Values.selfHostedObservability.resources.limits.cpu }}
            memory: {{ .Values.selfHostedObservability.resources.limits.memory }}
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: collector-config
        configMap:
          name: otel-collector-self-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-self
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-collector-self
spec:
  ports:
  - name: grpc-otlp
    port: 4317
    protocol: TCP
    targetPort: 4317
  - name: http-otlp
    port: 4318
    protocol: TCP
    targetPort: 4318
  selector:
    app: otel-collector-self
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-self-config
  namespace: {{ .Release.Namespace }}
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # 内存限制，防止 OOM
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

      # 批量处理，提高吞吐量
      batch:
        timeout: 1s
        send_batch_size: 1024

      # 资源属性，添加 service.namespace
      resource:
        attributes:
          - key: service.namespace
            value: {{ .Release.Namespace }}
            action: upsert

    # spanmetrics connector：从 Trace Span 生成 RED 指标，发送到 Prometheus
    connectors:
      spanmetrics:
        namespace: traces.spanmetrics
        histogram:
          explicit:
            buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 2500ms, 5000ms, 10000ms]
        dimensions:
          - name: http.method
          - name: http.response_status_code
          - name: http.route
          - name: rpc.method
          - name: rpc.service
          - name: rpc.grpc.status_code
        exemplars:
          enabled: true
        metrics_flush_interval: 15s
        resource_metrics_key_attributes:
          - service.name
          - service.namespace

    exporters:
      # 调试导出器（用于排查问题，默认关闭）
      # debug:
      #   verbosity: detailed

      # 导出到 Prometheus (remote_write)
      prometheusremotewrite:
        endpoint: "{{ .Values.selfHostedObservability.prometheusRemoteWrite.endpoint }}"
        # 将 OTLP 资源属性转换为 Prometheus 标签 (service.name → service_name)
        resource_to_telemetry_conversion:
          enabled: true
        # 添加 namespace 标签，便于 Grafana 按命名空间过滤
        external_labels:
          namespace: {{ .Release.Namespace }}
        tls:
          insecure: true
        add_metric_suffixes: true

      # 导出到 Tempo (OTLP)
      otlp/tempo:
        endpoint: "{{ .Values.selfHostedObservability.tempo.endpoint }}"
        tls:
          insecure: {{ .Values.selfHostedObservability.tempo.insecure }}
        compression: gzip

      # 导出到 Loki (via OTLP HTTP，loki exporter 在 0.83+ 已移除)
      otlphttp/loki:
        endpoint: "{{ .Values.selfHostedObservability.loki.otlpEndpoint }}"
        tls:
          insecure: true

    extensions:
      # 健康检查
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions:
        - health_check
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          # spanmetrics 作为 exporter 接收 spans 并生成 metrics
          exporters: [otlp/tempo, spanmetrics]
        metrics:
          # spanmetrics 作为 receiver 将生成的 metrics 注入此 pipeline
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlphttp/loki]
      telemetry:
        logs:
          level: info
        metrics:
          level: basic
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-self
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: otel-collector-self
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # 允许所有微服务发送数据
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.adService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.cartService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.checkoutService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.currencyService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.emailService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.frontend.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.loadGenerator.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.paymentService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.productCatalogService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.recommendationService.name }}
    - podSelector:
        matchLabels:
          app: {{ .Values.shippingService.name }}
    ports:
     - port: 4317
       protocol: TCP
     - port: 4318
       protocol: TCP
  egress:
  # 允许访问 monitoring namespace 的后端服务
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9090  # Prometheus
      protocol: TCP
    - port: 4317  # Tempo OTLP
      protocol: TCP
    - port: 3100  # Loki
      protocol: TCP
  # 允许 DNS 解析
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
{{- end }}
{{- end }}